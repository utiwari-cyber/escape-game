<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0a12">
<title>Escape</title>
<style>
  html,body{margin:0;height:100%;background:#0d0a12;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding-bottom:150px;box-sizing:border-box}
  @media (orientation:landscape){#wrap{padding-bottom:0}}
  canvas{display:block;width:min(100vw,calc(100dvh * 320 / 192));aspect-ratio:320/192;
    image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
  #pad{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;
    padding:16px 16px calc(24px + env(safe-area-inset-bottom));pointer-events:none}
  .grp{display:flex;gap:10px}
  .grid{display:grid;grid-template-columns:auto auto;gap:10px;justify-items:end}
  button{pointer-events:auto;width:80px;height:80px;border-radius:22px;border:2px solid #ffffff44;
    background:#ffffff14;color:#ffffffcc;font:bold 28px ui-monospace,Menlo,monospace;touch-action:none;
    -webkit-tap-highlight-color:transparent;padding:0}
  button.on{background:#ffffff44}
  .sm{width:68px;height:68px;border-radius:50%;font-size:12px;letter-spacing:.5px}
  #bS{border-color:#9fc4ffaa}
  #bG{border-color:#ffb86aaa}
  #bJ{grid-column:1 / span 2;width:146px;height:68px;border-radius:34px;font-size:16px;letter-spacing:1px}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="320" height="192"></canvas></div>
<div id="pad">
  <div class="grp"><button id="bL">&#9664;</button><button id="bR">&#9654;</button></div>
  <div class="grid">
    <button id="bG" class="sm">GUN</button><button id="bS" class="sm">SWORD</button>
    <button id="bJ">JUMP</button>
  </div>
</div>
<script>
(() => {
'use strict';

// ---------- constants ----------
const W = 10, H = 4, TW = 32, TH = 48, CW = W * TW, CH = H * TH;
const PW = 12, PH = 32;
const GRAV = 0.4, JUMPV = -7.3, WALK = 1.8, RUNJ = 2.4;
const STUN_FALL = 80, DEATH_FALL = 130, LOOSE_FRAMES = 30;
const MAXHP = 5, START_HP = 3, MAXAMMO = 9;

// ---------- levels ----------
// # stone  . empty  ^ spikes  L loose floor  P plate  G gate  E exit  T torch
// m goomba (stomp it)  x spiny (don't stomp)  A ammo  H heart  B boss
const LEVELS = [
  { name: 'The Dungeon', boss: 'ogre', tip: 'stomp monsters, SWORD or GUN them',
    pal: { bg: '#1a1322', line: '#140e1b', stone: '#6b5a48', hi: '#8f7a60', loose: '#66553f', lhi: '#86725a' },
    rooms: [
      { name: 'The Cell', exits: { r: 1 }, start: [2, 3], map: ['#.........', '#..T...T..', '#....#.m..', '##########'] },
      { name: 'The Spikes', exits: { l: 0, r: 2 }, map: ['..........', '.T......T.', '.......m..', '###^^#####'] },
      { name: 'The Gate', exits: { l: 1, r: 3 }, map: ['......G...', '.T....G..T', '.P....G.A.', '##LLL#####'] },
      { name: 'The Stairs', exits: { l: 2, r: 4 }, map: ['..........', '...T..####', '....LL....', '####^^####'] },
      { name: 'The Ogre', exits: { l: 3 }, map: ['..........', '.T......T.', '...A..B.HE', '##########'] },
    ] },
  { name: 'The Desert Palace', boss: 'wraith',
    pal: { bg: '#2b1f14', line: '#21170f', stone: '#b08a55', hi: '#d9b878', loose: '#a47f4c', lhi: '#cfae70' },
    rooms: [
      { name: 'Desert Gate', exits: { r: 1 }, start: [1, 3], map: ['#.........', '#..T...T..', '#..m...x..', '#####..###'] },
      { name: 'Pillared Hall', exits: { l: 0, r: 2 }, map: ['..........', '.T......T.', '..#.Am#..x', '##########'] },
      { name: 'Needle Gate', exits: { l: 1, r: 3 }, map: ['......G...', '.T....G..T', '.P....G.A.', '##^^L#####'] },
      { name: 'The Sandpit', exits: { l: 2, r: 4 }, map: ['..........', '.T......T.', '..H....m..', '##..######'] },
      { name: 'The Wraith', exits: { l: 3 }, map: ['..........', '.T......T.', 'A..H.B...E', '##########'] },
    ] },
  { name: "The Vizier's Tower", boss: 'vizier',
    pal: { bg: '#171028', line: '#110b20', stone: '#4a4a78', hi: '#7070aa', loose: '#434368', lhi: '#6565a0' },
    rooms: [
      { name: 'Tower Base', exits: { r: 1 }, start: [1, 3], map: ['#.........', '#..T...T..', '#......m.x', '####^^####'] },
      { name: 'Gate of Fire', exits: { l: 0, r: 2 }, map: ['......G...', '.T....G.T.', '.P....G.A.', '##L^L#####'] },
      { name: 'The Spire', exits: { l: 1, r: 3 }, map: ['....H.....', '...T##.T..', '..#.....m.', '##########'] },
      { name: 'Last Stand', exits: { l: 2, r: 4 }, map: ['..........', '.T......T.', '..m...A.m.', '####..####'] },
      { name: 'The Vizier', exits: { l: 3 }, map: ['..........', '.T......T.', 'A..H..B..E', '##########'] },
    ] },
  { name: 'Frozen Caverns', boss: 'yeti', slip: true, amb: 'snow', tip: 'the ice is slippery!',
    pal: { bg: '#0f1c2e', line: '#0a1522', stone: '#7aa6c9', hi: '#e4f6ff', loose: '#6e97b8', lhi: '#bfe3f7' },
    rooms: [
      { name: 'Ice Mouth', exits: { r: 1 }, start: [1, 3], map: ['#.........', '#..T...T..', '#...m.....', '##########'] },
      { name: 'Frost Spikes', exits: { l: 0, r: 2 }, map: ['..........', '.T......T.', '.m....#x..', '###^^#####'] },
      { name: 'Cracked Bridge', exits: { l: 1, r: 3 }, map: ['..........', '.T..b...T.', '.A.x..m...', '###LL#####'] },
      { name: 'The Crevasse', exits: { l: 2, r: 4 }, map: ['..........', '..T....T..', '.m....#x..', '##..######'] },
      { name: 'The Yeti', exits: { l: 3 }, map: ['..........', '.T......T.', '...A..B.HE', '##########'] },
    ] },
  { name: 'Jungle Ruins', boss: 'batking', amb: 'spore', tip: 'bats fly - SWORD or GUN them',
    pal: { bg: '#0f2418', line: '#0a1a11', stone: '#4f7a3a', hi: '#86b85a', loose: '#44683a', lhi: '#78a850' },
    rooms: [
      { name: 'Vine Gate', exits: { r: 1 }, start: [1, 3], map: ['#.........', '#..T...T..', '#...m.b...', '##########'] },
      { name: 'Root Spikes', exits: { l: 0, r: 2 }, map: ['..........', '.T......T.', '..m...#b..', '###^^#####'] },
      { name: 'Overgrown Gate', exits: { l: 1, r: 3 }, map: ['......G.b.', '.T....G..T', '.P....G.A.', '##LLL#####'] },
      { name: 'Sunken Temple', exits: { l: 2, r: 4 }, map: ['..........', '..T....T..', '.b..m.#x..', '###..#####'] },
      { name: 'The Bat King', exits: { l: 3 }, map: ['..........', '.T......T.', '...A..B.HE', '##########'] },
    ] },
  { name: 'Lava Forge', boss: 'golem', amb: 'ember', tip: 'lava kills - jump it!',
    pal: { bg: '#2a0f0a', line: '#1f0a07', stone: '#6e3b2c', hi: '#c26a3a', loose: '#5f3226', lhi: '#94503a' },
    rooms: [
      { name: 'Forge Door', exits: { r: 1 }, start: [1, 3], map: ['#.........', '#..T...T..', '#..x...m..', '#####vv###'] },
      { name: 'Molten Gap', exits: { l: 0, r: 2 }, map: ['..........', '.T......T.', '.m....#x..', '###vv#####'] },
      { name: 'Slag Bridge', exits: { l: 1, r: 3 }, map: ['..........', '.T..b...T.', '.A.x..m...', '##LL##vv##'] },
      { name: 'Anvil Gate', exits: { l: 2, r: 4 }, map: ['......G...', '.T....G..T', '.P....Gx..', '##LLL#####'] },
      { name: 'The Golem', exits: { l: 3 }, map: ['..........', '.T......T.', '...A..B.HE', '##########'] },
    ] },
  { name: 'MOON PARTY', boss: 'duck', grav: 0.22, jv: -6.2, amb: 'confetti', rainbow: true, tip: 'SURPRISE! low gravity - bounce around!',
    pal: { bg: '#2a1048', line: '#220c3c', stone: '#e0509a', hi: '#ffb3dc', loose: '#c84488', lhi: '#ff9ccf' },
    rooms: [
      { name: 'Launch Pad', exits: { r: 1 }, start: [1, 3], map: ['#.........', '#..T...T..', '#...A.m...', '##########'] },
      { name: 'Big Jump', exits: { l: 0, r: 2 }, map: ['..........', '..T....T..', '..m.A.....', '###...####'] },
      { name: 'Bounce Island', exits: { l: 1, r: 3 }, map: ['....b.....', '..T....T..', '.A....m#..', '##...###.#'] },
      { name: 'Disco Floor', exits: { l: 2, r: 4 }, map: ['..b..b....', '.T......T.', '..x...m...', '###...####'] },
      { name: 'Sir Quackers', exits: { l: 3 }, map: ['..........', '.T......T.', '.A.A..B.HE', '##########'] },
    ] },
  { name: 'Haunted Crypt', boss: 'lich', amb: 'mist', tip: 'ghosts chase through walls',
    pal: { bg: '#12101c', line: '#0d0b15', stone: '#3e4a4f', hi: '#7a9298', loose: '#37424a', lhi: '#5c6f78' },
    rooms: [
      { name: 'Crypt Door', exits: { r: 1 }, start: [1, 3], map: ['#.........', '#..T...T..', '#...g.....', '##########'] },
      { name: 'Bone Spikes', exits: { l: 0, r: 2 }, map: ['..........', '.T......T.', '..x...#g..', '###^^#####'] },
      { name: 'Rotting Floor', exits: { l: 1, r: 3 }, map: ['..........', '.T..g...T.', '.A.x..m...', '##LL##^^##'] },
      { name: 'Grave Pit', exits: { l: 2, r: 4 }, map: ['..........', '..T....T..', '.m....#xg.', '##..######'] },
      { name: 'The Lich', exits: { l: 3 }, map: ['..........', '.T......T.', '...A..B.HE', '##########'] },
    ] },
  { name: 'Storm Bridge', boss: 'dragon', amb: 'snow', tip: 'one slip and you fall',
    pal: { bg: '#1a2a4a', line: '#142040', stone: '#8a94a8', hi: '#d4ddf0', loose: '#7a849a', lhi: '#b0bad0' },
    rooms: [
      { name: 'Cliff Edge', exits: { r: 1 }, start: [1, 3], map: ['#.........', '#..T...T..', '#..b...m..', '######..##'] },
      { name: 'Rope Bridge', exits: { l: 0, r: 2 }, map: ['..........', '.T......T.', '..m..b..x.', '##LLL.####'] },
      { name: 'Stepping Stones', exits: { l: 1, r: 3 }, map: ['..........', '.T..b...T.', '.A..g.m...', '##..##.###'] },
      { name: 'Storm Gate', exits: { l: 2, r: 4 }, map: ['......G.b.', '.T....G..T', '.P....G.H.', '##LLL#####'] },
      { name: 'The Dragon', exits: { l: 3 }, map: ['..........', '.T......T.', '.A.A..B.HE', '##########'] },
    ] },
  { name: 'The Dark Throne', boss: 'king', amb: 'ember', tip: 'the final battle',
    pal: { bg: '#0a0a0d', line: '#050507', stone: '#3a3340', hi: '#c9a14a', loose: '#2e2833', lhi: '#a08038' },
    rooms: [
      { name: 'Black Gate', exits: { r: 1 }, start: [1, 3], map: ['#.........', '#..T...T..', '#..m...x..', '###vv#####'] },
      { name: 'Hall of Spikes', exits: { l: 0, r: 2 }, map: ['..........', '.T..b...T.', '..g...#x..', '###^^#####'] },
      { name: 'Hall of Fire', exits: { l: 1, r: 3 }, map: ['..........', '.T..b...T.', '.A.x..m...', '##LL##vv##'] },
      { name: 'Hall of Doom', exits: { l: 2, r: 4 }, map: ['..........', '..T....T..', '.m..g.#x..', '##..######'] },
      { name: 'The Dark King', exits: { l: 3 }, map: ['..........', '.T......T.', '.A.A.B.AHE', '##########'] },
    ] },
];
const BOSSES = {
  ogre:    { name: 'THE OGRE',      w: 34, h: 44, hp: 8,  beh: 'charger' },
  wraith:  { name: 'THE WRAITH',    w: 30, h: 36, hp: 10, beh: 'floater', volley: 1, dive: 2.6 },
  vizier:  { name: 'THE VIZIER',    w: 26, h: 42, hp: 14, beh: 'hopper' },
  yeti:    { name: 'THE YETI',      w: 36, h: 46, hp: 10, beh: 'charger', charge: 3.9, snow: true },
  batking: { name: 'THE BAT KING',  w: 36, h: 30, hp: 12, beh: 'floater', volley: 2, dive: 3.2 },
  golem:   { name: 'LAVA GOLEM',    w: 38, h: 46, hp: 14, beh: 'charger', charge: 3.0, quake: true },
  duck:    { name: 'SIR QUACKERS',  w: 36, h: 34, hp: 12, beh: 'hopper', summon: 'm', spread: true },
  lich:    { name: 'THE LICH',      w: 28, h: 42, hp: 14, beh: 'floater', volley: 3, dive: 2.4, ghost: true },
  dragon:  { name: 'STORM DRAGON',  w: 46, h: 34, hp: 16, beh: 'floater', volley: 3, dive: 3.4, rate: 60 },
  king:    { name: 'THE DARK KING', w: 30, h: 46, hp: 24, beh: 'hopper', summon: 'x', spread: true },
};

let saved = 0; try { saved = +localStorage.getItem('escape_lvl') || 0; } catch (_) {}
{ const q = /level=(\d+)/.exec(location.search); if (q) saved = +q[1] - 1; }
saved = Math.max(0, Math.min(LEVELS.length - 1, saved));
const save = n => { saved = n; try { localStorage.setItem('escape_lvl', n); } catch (_) {} };

// ---------- state ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let mode = 'title', modeT = 0;
let lvl = 0, roomIdx = 0, rm, pal, grid, loose, slabs, gateOpen;
let enemies, pickups, boss, bullets, eproj, fx;
let P, ck, tick = 0, bannerT = 0, bannerText = '';
let jumpBuf = 0, swordBuf = 0, gunBuf = 0, swingCounter = 0;
const keys = { l: false, r: false };
const setMode = m => { mode = m; modeT = 0; };

const cell = (c, r) => {
  if (c < 0) return rm.exits.l !== undefined ? '.' : '#';
  if (c >= W) return rm.exits.r !== undefined ? '.' : '#';
  if (r < 0 || r >= H) return '.';
  return grid[r][c];
};
const solid = (c, r) => {
  const ch = cell(c, r);
  return ch === '#' || ch === '^' || ch === 'v' || ch === 'L' || (ch === 'G' && !gateOpen);
};
function hitBox(x, y, w, h) {
  const c0 = Math.floor((x - w / 2) / TW), c1 = Math.floor((x + w / 2 - 0.01) / TW);
  const r0 = Math.floor((y - h) / TH), r1 = Math.floor((y - 0.01) / TH);
  for (let c = c0; c <= c1; c++) for (let r = r0; r <= r1; r++) if (solid(c, r)) return true;
  return false;
}
const hit = (x, y) => hitBox(x, y, PW, PH);
function supported() {
  const r = Math.floor((P.y + 1) / TH);
  return solid(Math.floor((P.x - PW / 2 + 1) / TW), r) || solid(Math.floor((P.x + PW / 2 - 1) / TW), r);
}
const ov = (ax, ay, aw, ah, bx, by, bw, bh) =>
  Math.abs(ax - bx) < (aw + bw) / 2 && ay > by - bh && ay - ah < by;
const G = () => LEVELS[lvl].grav || GRAV, JV = () => LEVELS[lvl].jv || JUMPV;
const doorOpen = () => !boss || boss.dead;

// ---------- setup ----------
function puff(x, y, n, color, spd = 1.5) {
  for (let i = 0; i < n; i++) fx.push({ x, y, vx: (Math.random() - .5) * spd * 2, vy: (Math.random() - .8) * spd * 1.5, life: 20 + Math.random() * 16, color });
}
function loadRoom(i) {
  roomIdx = i; rm = LEVELS[lvl].rooms[i]; pal = LEVELS[lvl].pal;
  grid = rm.map.map(s => s.split(''));
  loose = []; slabs = []; enemies = []; pickups = []; bullets = []; eproj = []; fx = []; boss = null; gateOpen = false;
  bannerText = i === 0 ? `LEVEL ${lvl + 1} - ${LEVELS[lvl].name}` : rm.name; bannerT = 150;
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const ch = grid[r][c], x = c * TW + TW / 2, y = (r + 1) * TH;
    if (ch === 'm' || ch === 'x' || ch === 'b' || ch === 'g') { enemies.push(mkEnemy(ch, x, y)); grid[r][c] = '.'; }
    else if (ch === 'A' || ch === 'H') { pickups.push({ x, y, type: ch }); grid[r][c] = '.'; }
    else if (ch === 'B') { boss = mkBoss(LEVELS[lvl].boss, x, y); grid[r][c] = '.'; }
  }
}
function mkEnemy(t, x, y) {
  const fly = t === 'b' || t === 'g';
  return { type: t, x, y: fly ? y - (t === 'b' ? 26 : 12) : y, by: y - (t === 'b' ? 26 : 12), vy: 0, dir: Math.random() < .5 ? -1 : 1,
    sp: t === 'm' ? 0.5 : 0.75, w: 14, h: t === 'g' ? 18 : (t === 'b' ? 11 : 14), ground: false, dead: false, dt: 0, anim: Math.random() * 6 };
}
function mkBoss(type, x, y) {
  const d = BOSSES[type];
  return Object.assign({ type, x, y, floorY: y, vx: 0, vy: 0, face: -1, state: 'wait', t: 0, flash: 0, dead: false, dt: 0,
    active: false, jumps: 0, last: -1 }, d, { max: d.hp });
}
function newPlayer(x, y, prev) {
  P = { x, y, vx: 0, vy: 0, ground: true, face: 1, anim: 0, stun: 0, dead: false, dt: 0, apex: y,
    hp: prev ? Math.max(prev.hp, START_HP) : START_HP, ammo: prev ? Math.max(prev.ammo, 4) : 6,
    atk: 0, shot: 0, shotCool: 0, inv: 0, swing: 0 };
}
function startLevel(i, prev) {
  lvl = i; loadRoom(0);
  const s = LEVELS[lvl].rooms[0].start;
  newPlayer(s[0] * TW + TW / 2, s[1] * TH, prev);
  ck = { room: 0, x: P.x, y: P.y };
  setMode('play');
}
function startGame() { startLevel(saved, null); }
function nextLevel() {
  if (lvl + 1 >= LEVELS.length) { save(0); setMode('win'); } else { save(lvl + 1); startLevel(lvl + 1, P); }
}
function respawn() { const prev = P; loadRoom(ck.room); newPlayer(ck.x, ck.y, prev); }
function die() { if (!P.dead) { P.dead = true; P.dt = 0; P.vx = 0; P.hp = 0; } }
function hurt(fromX) {
  if (P.inv > 0 || P.dead) return;
  P.hp--; P.inv = 75; P.atk = 0;
  puff(P.x, P.y - 16, 8, '#d33');
  if (P.hp <= 0) { die(); return; }
  P.vy = -3.2; P.vx = (P.x < fromX ? -1 : 1) * 1.5; P.ground = false; P.apex = P.y;
}

// ---------- player movement ----------
function moveX(dx) {
  const nx = P.x + dx;
  if (!hit(nx, P.y)) { P.x = nx; return; }
  if (!P.ground) {
    const c = Math.floor((nx + Math.sign(dx) * PW / 2) / TW);
    const r0 = Math.floor((P.y - PH) / TH), r1 = Math.floor((P.y - 0.01) / TH);
    let rt = -1;
    for (let r = r0; r <= r1; r++) if (solid(c, r)) { rt = r; break; }
    if (rt >= 0) {
      const top = rt * TH, rise = P.y - top;
      if (rise > 0 && rise <= 36 && !solid(c, rt - 1) && !hit(nx, top)) {
        P.y = top; P.x = nx; P.vy = 0; P.ground = true; return;
      }
    }
  }
  P.vx = 0;
}
function moveY(dy) {
  const ny = P.y + dy;
  const cl = Math.floor((P.x - PW / 2 + 1) / TW), cr = Math.floor((P.x + PW / 2 - 1) / TW);
  if (dy > 0) {
    const r = Math.floor(ny / TH), top = r * TH;
    if (top >= P.y - 0.01 && top <= ny && (solid(cl, r) || solid(cr, r))) {
      P.y = top; P.vy = 0; P.ground = true;
      const fall = P.y - P.apex;
      if (fall > DEATH_FALL) die(); else if (fall > STUN_FALL) P.stun = 18;
      return;
    }
    P.y = ny;
  } else {
    const row = Math.floor((ny - PH) / TH);
    if (solid(cl, row) || solid(cr, row)) { P.y = (row + 1) * TH + PH; P.vy = 0; }
    else P.y = ny;
  }
}

// ---------- enemies ----------
function updEnemy(e) {
  if (e.dead) { e.dt++; return; }
  if (e.type === 'b') {
    e.anim += 0.15; e.x += e.dir * 0.9;
    if (e.x < 12 || e.x > CW - 12 || solid(Math.floor((e.x + e.dir * 8) / TW), Math.floor((e.y - 5) / TH))) e.dir *= -1;
    e.y = e.by + Math.sin(e.anim * 0.9) * 14; return;
  }
  if (e.type === 'g') {
    e.anim += 0.1;
    const dx = P.x - e.x, dy = (P.y - 18) - (e.y - 9), d = Math.hypot(dx, dy) || 1;
    if (d < 160) { e.x += dx / d * 0.5; e.y += dy / d * 0.5; e.dir = Math.sign(dx) || 1; e.by = e.y; }
    else e.y = e.by + Math.sin(e.anim) * 5;
    e.x = Math.max(8, Math.min(CW - 8, e.x)); e.y = Math.max(22, Math.min(CH - 4, e.y)); return;
  }
  e.vy += G();
  const ny = e.y + e.vy;
  if (e.vy > 0) {
    const r = Math.floor(ny / TH), top = r * TH;
    if (top >= e.y - 0.01 && top <= ny && (solid(Math.floor((e.x - e.w / 2 + 1) / TW), r) || solid(Math.floor((e.x + e.w / 2 - 1) / TW), r))) {
      e.y = top; e.vy = 0; e.ground = true;
    } else { e.y = ny; e.ground = false; }
  } else e.y = ny;
  if (e.ground) {
    const nx = e.x + e.dir * e.sp, ahead = nx + e.dir * (e.w / 2);
    const wall = hitBox(nx, e.y, e.w, e.h);
